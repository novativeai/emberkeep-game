<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- OBJ_KEY_BRONZE — Bronze Magic Key: dissolves fog / expands the grid -->
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3a667"/>
      <stop offset="45%" stop-color="#b87333"/>
      <stop offset="100%" stop-color="#7c4a1c"/>
    </linearGradient>
    <radialGradient id="kglow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffe6b0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffe6b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="100" fill="url(#kglow)"/>
  <ellipse cx="120" cy="214" rx="36" ry="9" fill="#1d130a" opacity="0.20"/>
  <g transform="rotate(-32 120 120)">
    <!-- bow (head) -->
    <circle cx="120" cy="78" r="34" fill="url(#bronze)" stroke="#5e3712" stroke-width="4"/>
    <circle cx="120" cy="78" r="14" fill="#3b2410"/>
    <circle cx="111" cy="70" r="5" fill="#ffe6b0" opacity="0.7"/>
    <!-- shaft -->
    <rect x="112" y="108" width="16" height="74" rx="6" fill="url(#bronze)" stroke="#5e3712" stroke-width="3"/>
    <!-- teeth (bits) -->
    <rect x="128" y="150" width="18" height="12" rx="3" fill="url(#bronze)" stroke="#5e3712" stroke-width="3"/>
    <rect x="128" y="170" width="26" height="12" rx="3" fill="url(#bronze)" stroke="#5e3712" stroke-width="3"/>
  </g>
</svg>
