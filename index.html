<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Emberkeep — The Dragon Hatchery</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(120% 90% at 50% 18%, #3fa8d9 0%, #2e7fa6 52%, #1d5878 100%);
      }
      /* Water photo backdrop: a real full-screen <img> layer BEHIND the
         transparent game canvas (the isle floats over it). Cheap — composited
         by the browser, no GPU texture, no per-frame work. */
      .water-bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        pointer-events: none;
        user-select: none;
      }
      #game {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: auto;
      }
      .boot-note {
        position: fixed;
        bottom: 12px;
        width: 100%;
        text-align: center;
        font: 600 13px/1.4 -apple-system, 'Segoe UI', sans-serif;
        color: #fff6e8;
        opacity: 0.55;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img class="water-bg" src="/sprites/environment/full-water-bg.png" alt="" />
    <div id="game"></div>
    <div class="boot-note" id="boot-note">stoking the ember&hellip;</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
