<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Emberkeep — The Dragon Hatchery</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* The authored emberkeep backdrop is the ONLY background. In-canvas it is
           painted per the world JSON and the camera is held inside it; this fills
           the FIT letterbox with the same image so no other background is ever
           seen (dark warm fallback only if the file fails to load). */
        background: #160d0b;
      }
      /* TITLE-SCREEN ONLY background: the dreamy cloud art fills the whole window
         (incl. the FIT letterbox) behind everything. Shown on the title, hidden
         for gameplay so the in-game emberkeep backdrop returns. */
      .title-bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        display: none;
        pointer-events: none;
        user-select: none;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      /* Title logo: a transparent <img> CONTAINED near the TOP, over the cloud
         background, with the round Play button at the bottom — a clean, pro
         title layout. Shown only on the title. */
      .title-logo {
        position: fixed;
        top: 5%;
        left: 50%;
        transform: translateX(-50%);
        /* Constrain BOTH axes with max-* and let the image size itself: it scales
           proportionally to whichever limit binds (height on wide desktop, width on
           a narrow portrait phone), so the logo NEVER deforms. A fixed height + a
           max-width used to fight on portrait — the width clamped while the height
           stayed pinned, squishing the logo. */
        width: auto;
        height: auto;
        max-height: 58%;
        max-width: 92%;
        z-index: 1;
        display: none;
        pointer-events: none;
        user-select: none;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      #game {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
      }
      #game canvas {
        image-rendering: auto;
      }
      .boot-note {
        position: fixed;
        bottom: 12px;
        width: 100%;
        text-align: center;
        font: 600 13px/1.4 -apple-system, 'Segoe UI', sans-serif;
        color: #fff6e8;
        opacity: 0.55;
        pointer-events: none;
      }
      /* Landscape-mode hint for touch devices (iOS ignores orientation.lock):
         the game is PORTRAIT, so nudge the player back to portrait. */
      @media (pointer: coarse) and (orientation: landscape) {
        #rotate-hint { display: flex !important; }
      }
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #160d0b;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        color: #fff6e8;
        font: 600 18px/1.4 -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        pointer-events: none;
      }
      #rotate-hint svg {
        width: 72px;
        height: 72px;
        fill: none;
        stroke: #d4a843;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        animation: spin90 1.6s ease-in-out infinite;
      }
      @keyframes spin90 {
        0%,30% { transform: rotate(90deg); }
        60%,100% { transform: rotate(0deg); }
      }
    </style>
  </head>
  <body>
    <img class="title-bg" id="title-bg" src="/sprites/ui/title-screen-background.jpg" alt="" />
    <img class="title-logo" id="title-logo" src="/sprites/ui/title-logo.webp" alt="" />
    <div id="game"></div>
    <div class="boot-note" id="boot-note">stoking the ember&hellip;</div>
    <div id="rotate-hint">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect x="12" y="8" width="28" height="48" rx="4"/>
        <path d="M48 20 L56 28 L48 36"/>
        <line x1="56" y1="28" x2="40" y2="28"/>
      </svg>
      Rotate to portrait to play
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
