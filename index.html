<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Emberkeep — The Dragon Hatchery</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* The authored emberkeep backdrop is the ONLY background. In-canvas it is
           painted per the world JSON and the camera is held inside it; this fills
           the FIT letterbox with the same image so no other background is ever
           seen (dark warm fallback only if the file fails to load). */
        background: #160d0b url('/sprites/background/emberkeep.jpg') center / cover no-repeat;
      }
      /* Title logo: a real full-WINDOW <img> (covers the whole screen, including
         the FIT letterbox) behind the transparent canvas. Shown only on the
         title; the Play button (on the canvas) sits on top. */
      .title-logo {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 78%; /* reduced ~20% and anchored to the top, freeing the bottom strip for the round Play button */
        object-fit: cover;
        object-position: center 12%; /* sit the banner higher still */
        z-index: 1;
        display: none;
        pointer-events: none;
        user-select: none;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      #game {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: auto;
      }
      .boot-note {
        position: fixed;
        bottom: 12px;
        width: 100%;
        text-align: center;
        font: 600 13px/1.4 -apple-system, 'Segoe UI', sans-serif;
        color: #fff6e8;
        opacity: 0.55;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img class="title-logo" id="title-logo" src="/sprites/ui/title-logo.png" alt="" />
    <div id="game"></div>
    <div class="boot-note" id="boot-note">stoking the ember&hellip;</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
