<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Emberkeep — The Dragon Hatchery</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* The authored emberkeep backdrop is the ONLY background. In-canvas it is
           painted per the world JSON and the camera is held inside it; this fills
           the FIT letterbox with the same image so no other background is ever
           seen (dark warm fallback only if the file fails to load). */
        background: #160d0b;
      }
      /* TITLE-SCREEN ONLY background: the dreamy cloud art fills the whole window
         (incl. the FIT letterbox) behind everything. Shown on the title, hidden
         for gameplay so the in-game emberkeep backdrop returns. */
      .title-bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        display: none;
        pointer-events: none;
        user-select: none;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      /* Title logo: a transparent <img> CONTAINED near the TOP, over the cloud
         background, with the round Play button at the bottom — a clean, pro
         title layout. Shown only on the title. */
      .title-logo {
        position: fixed;
        top: 5%;
        left: 50%;
        transform: translateX(-50%);
        height: 58%;
        width: auto;
        max-width: 92%;
        z-index: 1;
        display: none;
        pointer-events: none;
        user-select: none;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      #game {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
      }
      #game canvas {
        image-rendering: auto;
      }
      .boot-note {
        position: fixed;
        bottom: 12px;
        width: 100%;
        text-align: center;
        font: 600 13px/1.4 -apple-system, 'Segoe UI', sans-serif;
        color: #fff6e8;
        opacity: 0.55;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img class="title-bg" id="title-bg" src="/sprites/ui/title-screen-background.jpg" alt="" />
    <img class="title-logo" id="title-logo" src="/sprites/ui/title-logo.png" alt="" />
    <div id="game"></div>
    <div class="boot-note" id="boot-note">stoking the ember&hellip;</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
